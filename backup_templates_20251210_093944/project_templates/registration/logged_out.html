{% extends "base.html" %}

{% block title %}已登出 - 家庭日历{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">已成功登出</h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="fas fa-sign-out-alt" style="font-size: 3rem; color: #28a745;"></i>
                    </div>
                    <p class="mb-4">您已成功登出系统。</p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{% url 'login' %}" class="btn btn-primary me-md-2">重新登录</a>
                        <a href="{% url 'family_calendar:month_view' %}" class="btn btn-outline-secondary">返回首页</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "family/base_family.html" %}

{% block title %}欢迎使用家庭管理系统{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="form-family text-center">
                <!-- 装饰元素 -->
                <div class="decoration-leaf leaf-1">🍃</div>
                <div class="decoration-leaf leaf-2">🌸</div>
                <div class="decoration-leaf leaf-3">🍁</div>
                <div class="decoration-leaf leaf-4">✨</div>
                
                <div class="mb-4">
                    <h2 style="font-family: 'Ma Shan Zheng', cursive; font-size: 3rem; margin-bottom: 20px;">
                        🏠 欢迎使用家庭管理系统
                    </h2>
                    <p class="text-muted" style="font-size: 1.1rem;">
                        创建或加入一个家庭，开始您的家庭协作之旅
                    </p>
                </div>
                
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <div class="family-card h-100">
                            <div class="family-header" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);">
                                <div style="font-size: 3rem; margin-bottom: 15px;">🏗️</div>
                                <h4 class="family-name">创建新家庭</h4>
                            </div>
                            <div class="p-4">
                                <p class="text-muted mb-3">
                                    创建属于您的家庭组，邀请家人一起管理家务、分享日程
                                </p>
                                <a href="{% url 'family:create' %}" class="btn btn-primary-family w-100">
                                    <i class="fas fa-plus me-2"></i>创建家庭
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="family-card h-100">
                            <div class="family-header" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);">
                                <div style="font-size: 3rem; margin-bottom: 15px;">🔍</div>
                                <h4 class="family-name">加入家庭</h4>
                            </div>
                            <div class="p-4">
                                <p class="text-muted mb-3">
                                    通过邀请码加入已有家庭，或搜索公开的家庭组
                                </p>
                                <div class="d-grid gap-2">
                                    <a href="{% url 'family:search' %}" class="btn btn-family">
                                        <i class="fas fa-search me-2"></i>搜索家庭
                                    </a>
                                    <a href="{% url 'family:invitations' %}" class="btn btn-family">
                                        <i class="fas fa-envelope me-2"></i>查看邀请
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 邀请码加入 -->
                <div class="family-card mt-4">
                    <div class="p-4">
                        <h5 style="color: #8b6f47; margin-bottom: 15px;">
                            <i class="fas fa-key me-2"></i>通过邀请码加入
                        </h5>
                        <form method="post" action="{% url 'family:join_by_code' %}">
                            {% csrf_token %}
                            <div class="row g-3 align-items-end">
                                <div class="col-md-9">
                                    <input type="text" 
                                           name="invite_code" 
                                           class="form-control" 
                                           placeholder="请输入邀请码"
                                           required>
                                </div>
                                <div class="col-md-3">
                                    <button type="submit" class="btn btn-primary-family w-100">
                                        <i class="fas fa-sign-in-alt me-2"></i>加入
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

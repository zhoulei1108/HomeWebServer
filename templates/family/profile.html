<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 家庭日历</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .profile-container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            text-align: center;
            color: white;
            position: relative;
        }
        
        .avatar-container {
            position: relative;
            display: inline-block;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }
        
        .avatar-upload {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #007bff;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .avatar-upload:hover {
            background: #0056b3;
            transform: scale(1.1);
        }
        
        .profile-name {
            margin-top: 15px;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .profile-bio {
            font-size: 14px;
            opacity: 0.9;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .profile-content {
            padding: 30px;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 10px;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .btn-cancel {
            background: #6c757d;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
        }
        
        .btn-cancel:hover {
            background: #545b62;
            transform: translateY(-2px);
        }
        
        .color-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .color-preview {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .color-preview:hover {
            transform: scale(1.1);
        }
        
        .interest-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .tag {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: #764ba2;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'family:dashboard' %}" class="back-link">
            <i class="fas fa-arrow-left me-2"></i>返回家庭中心
        </a>
        
        <div class="profile-container">
            <div class="profile-header">
                <div class="avatar-container">
                    <img src="{{ profile.avatar_url }}" alt="头像" class="avatar" id="avatarPreview">
                    <label for="id_avatar" class="avatar-upload">
                        <i class="fas fa-camera text-white"></i>
                    </label>
                </div>
                <h1 class="profile-name">{{ profile.display_name }}</h1>
                <p class="profile-bio">{{ profile.bio|default:"这个人很神秘，什么都没有留下..." }}</p>
                
                <div class="profile-stats">
                    <div class="stat-item">
                        <span class="stat-number">{{ user_stats.families_count }}</span>
                        <span class="stat-label">加入的家庭</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">{{ user_stats.invitations_sent }}</span>
                        <span class="stat-label">发送的邀请</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">{{ user_stats.invitations_received }}</span>
                        <span class="stat-label">收到的邀请</span>
                    </div>
                </div>
            </div>
            
            <div class="profile-content">
                <form method="post" enctype="multipart/form-data" id="profileForm">
                    {% csrf_token %}
                    
                    <!-- 基本信息 -->
                    <div class="form-section">
                        <h3 class="section-title">
                            <i class="fas fa-user me-2"></i>基本信息
                        </h3>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">姓名</label>
                                    <div class="row">
                                        <div class="col-6">
                                            <input type="text" name="first_name" class="form-control" 
                                                   placeholder="姓" value="{{ form.first_name.value|default:'' }}">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" name="last_name" class="form-control" 
                                                   placeholder="名" value="{{ form.last_name.value|default:'' }}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="id_nickname">昵称</label>
                                    <input type="text" name="nickname" class="form-control" 
                                           id="id_nickname" value="{{ form.nickname.value|default:'' }}"
                                           placeholder="在系统中显示的昵称">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="id_gender">性别</label>
                                    <select name="gender" class="form-control" id="id_gender">
                                        <option value="">请选择</option>
                                        {% for value, label in form.fields.gender.choices %}
                                            <option value="{{ value }}" {% if form.gender.value == value %}selected{% endif %}>
                                                {{ label }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="id_birthday">生日</label>
                                    <input type="date" name="birthday" class="form-control" 
                                           id="id_birthday" value="{{ form.birthday.value|default:'' }}">
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="id_email">邮箱</label>
                            <input type="email" name="email" class="form-control" 
                                   id="id_email" value="{{ form.email.value|default:'' }}">
                        </div>
                    </div>
                    
                    <!-- 个人偏好 -->
                    <div class="form-section">
                        <h3 class="section-title">
                            <i class="fas fa-heart me-2"></i>个人偏好
                        </h3>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="id_favorite_color">喜欢的颜色</label>
                                    <div class="color-input-wrapper">
                                        <input type="color" name="favorite_color" class="form-control" 
                                               id="id_favorite_color" value="{{ form.favorite_color.value|default:'#a8edea' }}">
                                        <div class="color-preview" id="colorPreview" 
                                             style="background-color: {{ form.favorite_color.value|default:'#a8edea' }}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="id_favorite_food">爱吃的食物</label>
                                    <input type="text" name="favorite_food" class="form-control" 
                                           id="id_favorite_food" value="{{ form.favorite_food.value|default:'' }}"
                                           placeholder="比如：火锅、烤肉、寿司...">
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="id_hobbies">个人爱好</label>
                            <textarea name="hobbies" class="form-control" id="id_hobbies" 
                                      rows="3" placeholder="比如：阅读、运动、音乐、旅行...">{{ form.hobbies.value|default:'' }}</textarea>
                        </div>
                    </div>
                    
                    <!-- 联系信息 -->
                    <div class="form-section">
                        <h3 class="section-title">
                            <i class="fas fa-address-book me-2"></i>联系信息
                        </h3>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="id_phone">手机号</label>
                                    <input type="text" name="phone" class="form-control" 
                                           id="id_phone" value="{{ form.phone.value|default:'' }}"
                                           placeholder="请输入手机号">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label" for="id_address">地址</label>
                                    <input type="text" name="address" class="form-control" 
                                           id="id_address" value="{{ form.address.value|default:'' }}"
                                           placeholder="请输入地址">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 个人简介 -->
                    <div class="form-section">
                        <h3 class="section-title">
                            <i class="fas fa-edit me-2"></i>个人简介
                        </h3>
                        
                        <div class="form-group">
                            <label class="form-label" for="id_bio">个人简介</label>
                            <textarea name="bio" class="form-control" id="id_bio" 
                                      rows="4" placeholder="介绍一下自己...">{{ form.bio.value|default:'' }}</textarea>
                        </div>
                    </div>
                    
                    <!-- 隐私设置 -->
                    <div class="form-section">
                        <h3 class="section-title">
                            <i class="fas fa-shield-alt me-2"></i>隐私设置
                        </h3>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="public_profile" class="form-check-input" 
                                           id="id_public_profile" {% if form.public_profile.value %}checked{% endif %}>
                                    <label class="form-check-label" for="id_public_profile">
                                        公开个人资料
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="notification_enabled" class="form-check-input" 
                                           id="id_notification_enabled" {% if form.notification_enabled.value %}checked{% endif %}>
                                    <label class="form-check-label" for="id_notification_enabled">
                                        启用通知
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="email_notifications" class="form-check-input" 
                                           id="id_email_notifications" {% if form.email_notifications.value %}checked{% endif %}>
                                    <label class="form-check-label" for="id_email_notifications">
                                        邮件通知
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 操作按钮 -->
                    <div class="text-center">
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save me-2"></i>保存资料
                        </button>
                        <a href="{% url 'family:dashboard' %}" class="btn-cancel">
                            <i class="fas fa-times me-2"></i>取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 头像预览
        document.getElementById('id_avatar').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 颜色预览
        document.getElementById('id_favorite_color').addEventListener('input', function(e) {
            document.getElementById('colorPreview').style.backgroundColor = e.target.value;
        });
        
        // 点击颜色预览也可以触发颜色选择器
        document.getElementById('colorPreview').addEventListener('click', function() {
            document.getElementById('id_favorite_color').click();
        });
        
        // 表单提交动画
        document.getElementById('profileForm').addEventListener('submit', function() {
            const submitBtn = this.querySelector('.btn-save');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>保存中...';
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>

{% extends "base.html" %}

{% block title %}登录 - 家庭日历{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">用户登录</h4>
                </div>
                <div class="card-body">
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        <strong>登录失败：</strong> 请检查用户名和密码。
                    </div>
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control" id="id_username" placeholder="输入用户名即可登录（测试模式）" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" id="id_password" placeholder="密码可选（测试模式）">
                            <small class="text-muted">测试模式：密码为空或正确密码均可登录</small>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">登录</button>
                        </div>
                        
                        <input type="hidden" name="next" value="{{ next }}">
                    </form>
                    
                    <div class="text-center mt-3">
                        还没有账号？
                        <a href="{% url 'register' %}">立即注册</a>
                    </div>
                </div>
                <div class="card-footer text-muted">
                    <small>
                        提示：使用管理员账户登录，或通过 <a href="/admin/">管理后台</a> 创建用户。
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

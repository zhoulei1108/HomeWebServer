{% extends "base.html" %}

{% block title %}注册 - 家庭日历{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">创建新账号</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        {% if form.errors %}
                            <div class="alert alert-danger">
                                请检查表单信息，所有字段均为必填。
                            </div>
                        {% endif %}

                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">用户名</label>
                            {{ form.username }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.password1.id_for_label }}" class="form-label">密码</label>
                            {{ form.password1 }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.password2.id_for_label }}" class="form-label">再次输入密码</label>
                            {{ form.password2 }}
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">注册并登录</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        已有账号？
                        <a href="{% url 'login' %}">返回登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

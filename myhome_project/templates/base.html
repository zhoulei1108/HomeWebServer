<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{% block title %}家庭日历{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .navbar-brand {
      font-weight: bold;
    }
    .footer {
      margin-top: auto;
      padding: 20px 0;
      background-color: #f8f9fa;
      border-top: 1px solid #dee2e6;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/calendar/">
        <i class="fas fa-calendar-alt me-2"></i>家庭日历
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="/calendar/">
              <i class="fas fa-calendar me-1"></i>月视图
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/events/">
              <i class="fas fa-list me-1"></i>事件管理
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin/">
              <i class="fas fa-cog me-1"></i>管理后台
            </a>
          </li>
        </ul>
        
        <ul class="navbar-nav">
          {% if user.is_authenticated %}
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                <i class="fas fa-user me-1"></i>{{ user.username }}
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/calendar/event/new/">
                  <i class="fas fa-plus me-1"></i>新建事件
                </a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="/accounts/logout/">
                  <i class="fas fa-sign-out-alt me-1"></i>登出
                </a></li>
              </ul>
            </li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link" href="/accounts/login/">
                <i class="fas fa-sign-in-alt me-1"></i>登录
              </a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- 消息提示 -->
  {% if messages %}
    <div class="container mt-3">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <!-- 主要内容 -->
  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container text-center">
      <small class="text-muted">
        <i class="fas fa-heart text-danger"></i> 家庭日历系统 &copy; 2025
      </small>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>新建事件</title>
  <style>
    /* 简单样式，按需调整 */
    body { font-family: Arial, sans-serif; margin: 20px; }
    .messages { margin-bottom: 1em; }
    .errorlist { color: red; }
    form { max-width: 600px; }
    label { display:block; margin-top:0.5em; font-weight:bold; }
  </style>
</head>
<body>
  <h1>新建事件</h1>

  <!-- messages 显示（需要在 view 中使用 django.contrib.messages） -->
  {% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">保存</button>
    <a href="/">返回</a>
  </form>
</body>
</html>

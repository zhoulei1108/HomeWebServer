<!-- 顶部导航栏 -->
<div class="header-nav">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col">
                <div class="nav-links">
                    <a href="{% url 'family_calendar:month_view' %}">
                        <i class="fas fa-calendar-alt me-1"></i>月视图
                    </a>
                    <a href="{% url 'events:list' %}">
                        <i class="fas fa-list me-1"></i>提醒管理
                    </a>
                    <a href="{% url 'events:create' %}">
                        <i class="fas fa-bell me-1"></i>新建提醒
                    </a>
                    <a href="/admin/">
                        <i class="fas fa-cog me-1"></i>管理后台
                    </a>
                </div>
            </div>
            <div class="col-auto">
                {% if user.is_authenticated %}
                    <div class="user-info">
                        <div class="user-avatar">
                            {{ user.username|first|upper }}
                        </div>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                                <i class="fas fa-user me-1"></i>{{ user.username }}
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="/admin/auth/user/{{ user.id }}/change/">
                                    <i class="fas fa-user-edit me-1"></i>个人设置
                                </a></li>
                                <li><a class="dropdown-item" href="/events/">
                                    <i class="fas fa-bell me-1"></i>我的提醒
                                </a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="/accounts/logout/">
                                    <i class="fas fa-sign-out-alt me-1"></i>退出登录
                                </a></li>
                            </ul>
                        </div>
                    </div>
                {% else %}
                    <a href="/accounts/login/" class="btn btn-sm btn-primary">
                        <i class="fas fa-sign-in-alt me-1"></i>登录
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>

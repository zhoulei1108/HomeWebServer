{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
/* 家庭管理模块的样式 */
.family-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 248, 240, 0.95) 100%);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    border: 2px solid rgba(255, 182, 193, 0.3);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;
    overflow: hidden;
}

.family-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(255, 182, 193, 0.3);
}

.family-header {
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    color: white;
    padding: 20px;
    text-align: center;
    position: relative;
}

.family-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    margin-bottom: 15px;
}

.family-name {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 2rem;
    margin: 0;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.member-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 236, 210, 0.9) 100%);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    border: 2px solid rgba(255, 182, 193, 0.2);
    transition: all 0.3s ease;
}

.member-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3);
}

.member-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.role-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    display: inline-block;
}

.role-owner {
    background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
    color: white;
}

.role-admin {
    background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
    color: white;
}

.role-member {
    background: linear-gradient(135deg, #a8e6cf 0%, #dcedc8 100%);
    color: #2d5016;
}

.invitation-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 248, 255, 0.95) 100%);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    border: 2px solid rgba(168, 237, 234, 0.3);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;
}

.invitation-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(168, 237, 234, 0.3);
}

.stats-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 240, 255, 0.9) 100%);
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    border: 2px solid rgba(168, 237, 234, 0.2);
    transition: all 0.3s ease;
}

.stats-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(168, 237, 234, 0.3);
}

.stats-number {
    font-size: 2.5rem;
    font-weight: bold;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.btn-family {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 236, 210, 0.8) 100%);
    border: 2px solid rgba(255, 182, 193, 0.3);
    color: #8b6f47;
    border-radius: 20px;
    padding: 10px 20px;
    transition: all 0.3s ease;
    font-weight: 500;
}

.btn-family:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 236, 210, 0.9) 100%);
    color: #5f4b8b;
}

.btn-primary-family {
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    border: 2px solid rgba(168, 237, 234, 0.5);
    color: #5f4b8b;
}

.btn-primary-family:hover {
    box-shadow: 0 8px 20px rgba(168, 237, 234, 0.4);
}

.permission-check {
    width: 20px;
    height: 20px;
    accent-color: #ff9a9e;
}

.form-family {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 248, 240, 0.95) 100%);
    border-radius: 20px;
    padding: 30px;
    border: 2px solid rgba(255, 182, 193, 0.3);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
}

.form-control {
    border: 2px solid rgba(255, 182, 193, 0.2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.8);
    transition: all 0.3s ease;
}

.form-control:focus {
    border-color: rgba(168, 237, 234, 0.5);
    box-shadow: 0 0 10px rgba(168, 237, 234, 0.3);
    background: rgba(255, 255, 255, 0.9);
}

.decoration-leaf {
    position: absolute;
    opacity: 0.1;
    font-size: 20px;
    pointer-events: none;
}

.leaf-1 { top: 10px; left: 10px; animation: float 6s ease-in-out infinite; }
.leaf-2 { top: 10px; right: 10px; animation: float 8s ease-in-out infinite reverse; }
.leaf-3 { bottom: 10px; left: 10px; animation: float 7s ease-in-out infinite reverse; }
.leaf-4 { bottom: 10px; right: 10px; animation: float 9s ease-in-out infinite; }

@keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
}

/* 模态框样式 */
.modal-content {
    border-radius: 20px;
    border: 2px solid rgba(255, 182, 193, 0.3);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    overflow: hidden;
}

.modal-header {
    border-bottom: 2px solid rgba(255, 182, 193, 0.2);
}

.modal-footer {
    border-top: 2px solid rgba(255, 182, 193, 0.2);
}

.modal .form-control {
    border: 2px solid rgba(255, 182, 193, 0.2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.9);
}

.modal .form-control:focus {
    border-color: rgba(168, 237, 234, 0.5);
    box-shadow: 0 0 10px rgba(168, 237, 234, 0.3);
}

/* 成员卡片点击效果 */
.member-profile-trigger {
    position: relative;
    overflow: hidden;
}

.member-profile-trigger::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s;
}

.member-profile-trigger:hover::before {
    left: 100%;
}

/* 表单复选框样式 */
.form-check-input:checked {
    background-color: #ff9a9e;
    border-color: #ff9a9e;
}

.form-check-input:focus {
    border-color: #ff9a9e;
    box-shadow: 0 0 0 0.25rem rgba(255, 154, 158, 0.25);
}
</style>
{% endblock %}
